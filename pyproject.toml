[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "datapipe-neuro"
dynamic = ["version"]
description = "Dataset-aware pipeline for filing, registering, segmenting and compressing acquisition data."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Lars B. Rollik", email = "lars@rollik.me" },
]
dependencies = [
    "pyyaml>=6",   # parse StitchIt recipe_*.yml
    "numpy>=1.24",  # read sample counts from .npy sidecars (splits); shape only, never loaded
]

[project.scripts]
datapipe = "datapipe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy", "ruff"]
# docs.yml installs this extra; without it the workflow fails before mkdocs runs.
docs = ["mkdocs-material"]

# The `compress` stage shells out to the datapack CLI rather than importing it, so
# datapack-neuro is not a dependency here: a run that never compresses must not have
# to install it. Stages needing brainreg and brainglobe-segmentation are the same way.

[project.urls]
Homepage = "https://github.com/larsrollik/datapipe"
Documentation = "https://larsrollik.github.io/datapipe/"
"Issue Tracker" = "https://github.com/larsrollik/datapipe/issues"

# The version comes from the git tag. A literal here would be a second source of truth that
# commitizen does not rewrite -- it updates VERSION only -- so the wheel kept its old number
# while the tag advanced, and the first release published 0.1.0 under the tag v0.2.0.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/datapipe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datapipe"]

# ---------------------------------------------------------------------------
# Versioning. release.yml runs `cz bump`, which needs this section: without it the
# workflow fails on its first run, having been copied from a repo that had one.
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.2.0"
version_files = ["VERSION"]
tag_format = "v$version"
update_changelog_on_bump = false

[tool.ruff]
line-length = 88
src = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
